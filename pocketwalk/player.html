<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pocket Walk</title>
<style>
  :root { --bg: #10140f; --fg: #eef2e6; --dim: #9aa38f; --accent: #8fd14f; --line: #2a3226; }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f6f8f1; --fg: #1a2114; --dim: #5d6853; --accent: #3f7d12; --line: #d9dfcf; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.5 system-ui, sans-serif; }
  main { max-width: 34rem; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.4rem; line-height: 1.25; margin: 0 0 4px; }
  .dim { color: var(--dim); margin: 0; }
  #go {
    display: block; width: 100%; margin: 24px 0 12px; padding: 28px 16px; border: 0; border-radius: 20px;
    background: var(--accent); color: var(--bg); font: 600 1.35rem/1.2 system-ui, sans-serif; cursor: pointer;
  }
  #hint { min-height: 3em; margin: 0 0 20px; text-align: center; }
  svg { display: block; width: 100%; max-height: 300px; margin: 0 0 20px; border: 1px solid var(--line); border-radius: 16px; }
  ol { list-style: none; margin: 0 0 24px; padding: 0; border-top: 1px solid var(--line); }
  li { display: flex; gap: 12px; padding: 12px 4px; border-bottom: 1px solid var(--line); cursor: pointer; }
  li span:first-child { flex: 1; }
  li.now { color: var(--accent); font-weight: 600; }
  li.done span:first-child { color: var(--dim); text-decoration: line-through; }
  details { color: var(--dim); }
  details p { color: var(--fg); }
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <p class="dim" id="meta"></p>
  <button id="go"></button>
  <p id="hint"></p>
  <svg id="map" viewBox="0 0 320 240" role="img" aria-label="Sketch of the route"></svg>
  <ol id="tracks"></ol>
  <details><summary>Read the script</summary><div id="script"></div></details>
</main>
<audio id="audio" preload="auto"></audio>
<script>
const WALK = /*WALK_DATA*/null;
const $ = id => document.getElementById(id);
const audio = $("audio");
const KEY = "pocketwalk:" + WALK.title;
const last = WALK.tracks.length - 1;
let current = 0, finished = false;
const urls = [];

function url(i) {
  if (!urls[i]) {
    const bin = atob(WALK.tracks[i].audio);
    const bytes = new Uint8Array(bin.length);
    for (let j = 0; j < bin.length; j++) bytes[j] = bin.charCodeAt(j);
    urls[i] = URL.createObjectURL(new Blob([bytes], { type: "audio/mpeg" }));
  }
  return urls[i];
}

function load(i, play) {
  current = Math.max(0, Math.min(last, i));
  finished = false;
  audio.src = url(current);
  try { localStorage.setItem(KEY, current); } catch (e) {}
  if ("mediaSession" in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: WALK.tracks[current].title, artist: "Pocket Walk", album: WALK.title,
    });
  }
  if (play) audio.play();
  render();
}

function toggle() {
  if (finished) return load(0, true);
  audio.paused ? audio.play() : audio.pause();
}

function render() {
  const playing = !audio.paused && !audio.ended;
  const title = WALK.tracks[current].title;
  const fresh = audio.currentTime < 1;
  $("go").textContent = finished ? "Walk it again"
    : playing ? "Pause"
    : !fresh ? "Resume"
    : current === 0 ? "Start the walk"
    : current === last ? "I'm back"
    : "I'm here";
  $("hint").textContent = finished ? "That's the walk. Stay out a little longer."
    : playing ? "Now put your phone in your pocket and look up."
    : current === 0 ? "Earbuds in. One tap, then the screen is done."
    : fresh ? "Next: " + title + ". Press play on your earbuds when you arrive."
    : "";
  [...$("tracks").children].forEach((li, i) => {
    li.className = i === current && !finished ? "now" : i < current || finished ? "done" : "";
  });
}

audio.addEventListener("play", render);
audio.addEventListener("pause", render);
audio.addEventListener("ended", () => {
  // Cue up the next stop but stay silent: the walk between stops belongs to the listener.
  if (current < last) load(current + 1, false);
  else { finished = true; render(); }
});
$("go").addEventListener("click", toggle);

if ("mediaSession" in navigator) {
  const on = (action, fn) => { try { navigator.mediaSession.setActionHandler(action, fn); } catch (e) {} };
  on("play", () => audio.play());
  on("pause", () => audio.pause());
  on("nexttrack", () => load(current + 1, true));
  on("previoustrack", () => load(audio.currentTime > 3 ? current : current - 1, true));
}

function drawMap() {
  const pts = WALK.route, W = 320, H = 240, pad = 24;
  const lons = pts.map(p => p[0]), lats = pts.map(p => p[1]);
  const minLon = Math.min(...lons), maxLon = Math.max(...lons), minLat = Math.min(...lats), maxLat = Math.max(...lats);
  const kx = Math.cos((minLat + maxLat) / 2 * Math.PI / 180);
  const scale = Math.min((W - 2 * pad) / ((maxLon - minLon) * kx || 1e-9), (H - 2 * pad) / (maxLat - minLat || 1e-9));
  const x = lon => W / 2 + (lon - (minLon + maxLon) / 2) * kx * scale;
  const y = lat => H / 2 - (lat - (minLat + maxLat) / 2) * scale;
  const line = pts.map(p => x(p[0]).toFixed(1) + "," + y(p[1]).toFixed(1)).join(" ");
  let svg = `<polyline points="${line}" fill="none" stroke="var(--dim)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`;
  svg += `<circle cx="${x(WALK.start.lon)}" cy="${y(WALK.start.lat)}" r="6" fill="var(--fg)"/>`;
  WALK.stops.forEach((s, i) => {
    svg += `<circle cx="${x(s.lon)}" cy="${y(s.lat)}" r="11" fill="var(--accent)"/>`
      + `<text x="${x(s.lon)}" y="${y(s.lat) + 4.5}" text-anchor="middle" font-size="13" font-weight="700" fill="var(--bg)">${i + 1}</text>`;
  });
  $("map").innerHTML = svg;
}

document.title = WALK.title;
$("title").textContent = WALK.title;
const audioMin = Math.round(WALK.tracks.reduce((a, t) => a + t.seconds, 0) / 60);
$("meta").textContent = `${WALK.stops.length} stops · ${WALK.distance} · ${audioMin} min of audio`;
WALK.tracks.forEach((t, i) => {
  const li = document.createElement("li");
  const name = document.createElement("span"), len = document.createElement("span");
  name.textContent = i === 0 || i === last ? t.title : i + ". " + t.title;
  len.textContent = Math.floor(t.seconds / 60) + ":" + String(t.seconds % 60).padStart(2, "0");
  len.className = "dim";
  li.append(name, len);
  li.addEventListener("click", () => load(i, true));
  $("tracks").append(li);
  const h = document.createElement("h3"), p = document.createElement("p");
  h.textContent = t.title;
  p.textContent = t.text;
  $("script").append(h, p);
});
drawMap();
let saved = 0;
try { saved = parseInt(localStorage.getItem(KEY)) || 0; } catch (e) {}
load(saved, false);
</script>
</body>
</html>
